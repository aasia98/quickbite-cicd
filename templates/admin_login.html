
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - QuickBite</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>
    <h1>🍔 QuickBite</h1>
    <p>Administrator Login</p>

    <a href="{{ url_for('home') }}" class="cart-link">
        ← Back to Menu
    </a>
</header>

<main>

    <div class="login-container">

        <h2>Admin Login</h2>

        <p>Enter your credentials to manage orders.</p>

        {% if error %}
            <p class="error-message">{{ error }}</p>
        {% endif %}

        <form action="{{ url_for('admin_login') }}"
              method="POST"
              class="checkout-form">

            <label for="username">Username</label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                autocomplete="current-password"
                required
            >

            <button type="submit">
                Login to Dashboard
            </button>

        </form>

    </div>

</main>

<footer>
    <p>QuickBite Food Delivery | DevOps Project</p>
</footer>

</body>
</html>
