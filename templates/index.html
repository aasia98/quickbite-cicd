
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>QuickBite Food Delivery</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>🍔 QuickBite</h1>

        <p>Delicious food delivered to your doorstep! Fresh meals, great taste, fast delivery.</p>

        <a href="{{ url_for('view_cart') }}" class="cart-link">
            🛒 View Cart ({{ cart_count }})
        </a>
        <a href="{{ url_for('track_order') }}" class="cart-link">
    📦 Track Order
        </a>
        <a href="{{ url_for('admin_login') }}" class="cart-link">
    🔐 Admin Login
        </a>
        
    </header>


    <!-- MAIN MENU -->
    <main>

        <h2>Our Food Menu</h2>

        <div class="menu-grid">

            {% for item in menu %}

            <div class="food-card">

                <!-- FOOD IMAGE -->
                <img
                    src="{{ url_for('static',
                        filename='images/' + item.image) }}"
                    alt="{{ item.name }}"
                    class="food-image"
                >

                <!-- FOOD NAME -->
                <h3>{{ item.name }}</h3>

                <!-- FOOD PRICE -->
                <p class="price">Rs. {{ item.price }}</p>

                <!-- ADD TO CART BUTTON -->
                <form
                    action="{{ url_for('add_to_cart',
                        item_id=item.id) }}"
                    method="POST">

                    <button type="submit">
                        🛒 Add to Cart
                    </button>

                </form>

            </div>

            {% endfor %}

        </div>

    </main>


    <!-- FOOTER -->
    <footer>
        <p>QuickBite Food Delivery | DevOps Project</p>
    </footer>

</body>
</html>
